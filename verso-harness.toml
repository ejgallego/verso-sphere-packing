package_name = "SpherePackingBlueprint"
blueprint_main = "SpherePackingBlueprintMain"
formalization_path = "Sphere-Packing-LaTeX-Reference"
chapter_root = "SpherePackingBlueprint/Chapters"
tex_source_glob = "./Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/*.tex"

[lt]
default_chapters = [
  "SpherePackingBlueprint/Chapters/SpherePackings.lean",
  "SpherePackingBlueprint/Chapters/PackingsDensity.lean",
  "SpherePackingBlueprint/Chapters/E8.lean",
  "SpherePackingBlueprint/Chapters/FourierAnalysis.lean",
  "SpherePackingBlueprint/Chapters/CohnElkies.lean",
  "SpherePackingBlueprint/Chapters/ModularForms.lean",
  "SpherePackingBlueprint/Chapters/MagicFunctions.lean",
  "SpherePackingBlueprint/Chapters/ModularInequalities.lean",
]

[lt.source_files]
"SpherePackingBlueprint/Chapters/SpherePackings.lean" = [
  "Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/sphere-packings.tex",
  "Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/sphere-packings-scaling.tex",
  "Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/lattice-periodic-packings.tex",
  "Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/main-result.tex",
]
"SpherePackingBlueprint/Chapters/PackingsDensity.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/packings-density.tex"]
"SpherePackingBlueprint/Chapters/E8.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/E8-defs.tex"]
"SpherePackingBlueprint/Chapters/FourierAnalysis.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/fourier-analysis.tex"]
"SpherePackingBlueprint/Chapters/CohnElkies.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/cohn-elkies.tex"]
"SpherePackingBlueprint/Chapters/ModularForms.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/modular-forms.tex"]
"SpherePackingBlueprint/Chapters/MagicFunctions.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/construct-a-b.tex"]
"SpherePackingBlueprint/Chapters/ModularInequalities.lean" = ["Sphere-Packing-LaTeX-Reference/blueprint/src/subsections/modform-ineq.tex"]

[lt.node_kinds]
theorem = "theorem"
definition = "definition"
lemma = "lemma_"
corollary = "corollary"
proof = "proof"
proposition = "lemma_"

[harness]
native_warnings = false
docstring_warnings = false
strict_external_code = true
